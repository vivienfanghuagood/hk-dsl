name: CI

# The two tiers that need no GPU, on every push and pull request: the hk
# dialect built against a prebuilt MLIR, then the IR tier (no hipcc) and the
# codegen tier (hipcc, no GPU). The GPU tier needs a Radeon and runs on the
# development pod (scripts/gpu_suite.sh; docs/building.md#ci).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # MLIR 23.1.3 as scripts/build_mlir.sh installs it, for CPython 3.10 on
  # Ubuntu 22.04 -- this runner's python3 -- attached to the ci-mlir-23.1.3
  # release, so a run downloads 0.9 GB instead of building LLVM for hours.
  MLIR_RELEASE: ci-mlir-23.1.3
  MLIR_ASSET: mlir-23.1.3-install-cp310-ubuntu22.04-x86_64.tar.zst
  ROCM_VERSION: "7.1"

jobs:
  tiers:
    name: IR and codegen tiers
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MLIR 23.1.3, prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MLIR_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$MLIR_ASSET" --dir "$RUNNER_TEMP"
          sudo mkdir -p /opt/hk-llvm
          sudo tar -C /opt/hk-llvm -I zstd -xf "$RUNNER_TEMP/$MLIR_ASSET"

      # hip-dev pulls in hipcc, rocm-llvm and the HIP runtime it links
      # against; the device libraries are the bitcode every kernel links.
      - name: hipcc (ROCm ${{ env.ROCM_VERSION }})
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/$ROCM_VERSION jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq
          sudo apt-get install -y -qq hip-dev rocm-device-libs
          echo /opt/rocm/bin >> "$GITHUB_PATH"

      - name: Python packages
        run: >
          /usr/bin/python3 -m pip install --user "nanobind==2.15.0" numpy pybind11
          typing_extensions pytest pytest-xdist

      - name: The hk dialect
        run: >
          HK_LLVM_ROOT=/opt/hk-llvm PYTHON=/usr/bin/python3 JOBS=4
          HK_MLIR_BUILD="$RUNNER_TEMP/hk-build" scripts/build_hk_mlir.sh

      # Keys are content hashes inside the cache, so a stale cache costs
      # recompiles, never a wrong kernel; the key only decides what to save.
      - name: hk's compile cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hk
          key: hk-cache-rocm${{ env.ROCM_VERSION }}-${{ hashFiles('include/**', 'python/hk/**/*.py', 'third_party/HipKittens/include/**') }}
          restore-keys: hk-cache-rocm${{ env.ROCM_VERSION }}-

      - name: IR tier
        run: PYTHONPATH=python /usr/bin/python3 -m pytest -q -p no:cacheprovider -m "not gpu" tests/hk/ir

      - name: codegen tier
        run: PYTHONPATH=python /usr/bin/python3 -m pytest -q -p no:cacheprovider -n auto tests/hk/codegen
