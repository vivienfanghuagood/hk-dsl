name: Install matrix

# What a new user does, on each supported (ROCm, GPU) pair: a fresh container of a stock ROCm image
# installs the wheel built from this commit, runs README.md's quick start as written, and runs one GPU
# test with an exact answer (scripts/ci/install_smoke.py; docs/testing.md#the-install-matrix).
# Nightly on main, by hand, and before a release candidate is tagged (docs/releasing.md). Never on pull
# requests: every leg takes a GPU.
#
# The legs:
#   ROCm 7.2.3 (rocm/pytorch, hipcc = clang 22)  gfx950, gfx1201
#   ROCm 10.1.0 (rocm/pytorch, hipcc = clang 24)  gfx950 (gfx1201: the image is not on its runner yet)
#   ROCm 7.2.4 (the gfx1100 CI pod's image)       gfx1100: no container runtime in the pod, so the
#                                                 wheel goes into a fresh directory (pip --target)
# Python 3.12 on every leg (both stock images): the cp312 wheel. cp314 (TheRock's images) is not built.
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # run_gfx950.sh asks whether an orphan container's run is still in progress

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: false

env:
  MLIR_RELEASE: ci-mlir-23.1.3
  MLIR_ASSET: mlir-23.1.3-install-cp310-ubuntu22.04-x86_64.tar.zst

jobs:
  wheel:
    # The cp312 wheel as a release builds it: glibc 2.35 (Ubuntu 22.04), retagged manylinux and checked
    # (ci.yml's wheel step, for 3.12). The kit is the wheel, the wheels the stock images lack (pybind11),
    # README.md and install_smoke.py: all a leg's container sees.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MLIR 23.1.3, prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MLIR_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$MLIR_ASSET" --dir "$RUNNER_TEMP"
          sudo mkdir -p /opt/hk-llvm
          sudo tar -C /opt/hk-llvm -I zstd -xf "$RUNNER_TEMP/$MLIR_ASSET"
      - name: Python packages
        run: >
          python -m pip install "nanobind==2.15.0" numpy pybind11 typing_extensions
          "setuptools>=64" auditwheel "wheel>=0.42"
      - name: The hk dialect for CPython 3.12
        run: >
          LLVM_INSTALL=/opt/hk-llvm/install-cp310 PYTHON="$(command -v python)" JOBS=4
          HK_MLIR_BUILD="$RUNNER_TEMP/hk-build" scripts/build_hk_mlir.sh
      - name: Wheel, manylinux tag, glibc check
        run: |
          PYTHON="$(command -v python)" ISOLATION=0 OUT="$RUNNER_TEMP/dist" scripts/build_wheel.sh
          (cd "$RUNNER_TEMP/dist" && OUT=manylinux PYTHON="$(command -v python)" \
            "$GITHUB_WORKSPACE/scripts/manylinux_tag.sh" ./*linux_x86_64.whl)
          python scripts/check_wheel_glibc.py "$RUNNER_TEMP"/dist/manylinux/*.whl
      - name: The install kit
        run: |
          mkdir -p kit/deps
          cp "$RUNNER_TEMP"/dist/manylinux/hk_dsl-*.whl README.md scripts/ci/install_smoke.py kit/
          python -m pip download -q --no-deps -d kit/deps "pybind11==3.1.0"
          ls -l kit kit/deps
      - uses: actions/upload-artifact@v4
        with:
          name: install-kit
          path: kit
          retention-days: 14

  gfx950:
    needs: wheel
    runs-on: [self-hosted, hk-gpu, gfx950]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rocm: '7.2.3', image: 'rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0'}
          - {rocm: '10.1.0', image: 'rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0'}
    name: gfx950, ROCm ${{ matrix.rocm }}
    env:
      HK_CI_MODE: install
      HK_CI_IMAGE: ${{ matrix.image }}
      HK_CI_TIER: install-gfx950-rocm${{ matrix.rocm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: install-kit
          path: install-kit
      - name: Install, quick start, one GPU test on an MI355X
        run: exec scripts/ci/run_gfx950.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gfx1201:
    needs: wheel
    runs-on: [self-hosted, hk-gpu, gfx1201]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rocm: '7.2.3', image: 'rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.10.0'}
    name: gfx1201, ROCm ${{ matrix.rocm }}
    env:
      HK_CI_MODE: install
      HK_CI_IMAGE: ${{ matrix.image }}
      HK_CI_TIER: install-gfx1201-rocm${{ matrix.rocm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: install-kit
          path: install-kit
      - name: Install, quick start, one GPU test on a Radeon AI PRO R9700
        run: exec scripts/ci/run_gfx1201.sh

  gfx1100:
    needs: wheel
    runs-on: [self-hosted, hk-gpu, gfx1100-x4]
    timeout-minutes: 90
    name: gfx1100, ROCm 7.2.4 (the CI pod's image)
    env:
      HK_CI_MODE: install
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: install-kit
          path: install-kit
      - name: Install, quick start, one GPU test on a W7900D
        run: exec scripts/ci/run_gfx1100.sh
