name: GPU tier

# The GPU tier (scripts/gpu_suite.sh) on self-hosted runners on the MI355X
# workstation (scripts/ci/, docs/testing.md#the-gpu-tier): gfx950 on one of its
# idle MI355X, gfx1100 relayed to the CI pod on node 0044 and sharded over its
# four W7900D. On pushes to main and by hand only. Never add pull_request or
# pull_request_target: the repository is public, and a fork's code must never
# reach these machines.

# The GPU steps exec their script (`exec scripts/ci/...`): on cancel or timeout the runner signals
# the step's shell alone, so the script must be that shell to see it and kill its container or pod
# run (docs/testing.md, "Cancelled jobs and orphan containers").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # run_gfx950.sh asks whether an orphan container's run is still in progress

jobs:
  # The job names are main's required checks; renaming one is a change to
  # main's branch protection too.
  gfx950:
    # Any runner labelled gfx950: there may be several on the workstation, each on its own GPUs
    # (HK_CI_GPUS) with its own state (HK_CI_STATE), so different refs' runs go in parallel.
    runs-on: [self-hosted, hk-gpu, gfx950]
    timeout-minutes: 120
    # One run per arch and ref: a push waits for the run in progress, and
    # replaces a push still waiting.
    concurrency:
      group: gpu-gfx950-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: GPU tier on an MI355X
        run: exec scripts/ci/run_gfx950.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx950-report
          path: gha-report/
          if-no-files-found: ignore

  gfx950-vllm:
    # The deployment image: the vLLM nightly the DeepSeek-V4.1 routes were measured on (ROCm 10,
    # hipcc clang 23), whose compiler has differed from rocm/pytorch's three times (#35, #39, a
    # dp128x224 spill). The routes' tests and the engine contract (docs/design/serving-readiness.md,
    # A7 / A9), not the whole tier; its own dialect build and kernel cache (x950v/ci under the runner
    # instance's HK_CI_STATE: set HK_CI_DIRNAME, not HK_CI_DIR, so that each instance keeps its own).
    runs-on: [self-hosted, hk-gpu, gfx950]
    timeout-minutes: 90
    concurrency:
      group: gpu-gfx950-vllm-${{ github.ref }}
      cancel-in-progress: false
    env:
      HK_CI_TIER: gfx950-vllm
      HK_CI_DIRNAME: x950v
      HK_CI_IMAGE: vllm/vllm-openai-rocm:nightly-rocm100-e68efc685ab1e6f1eda004ced7157e3ca411da2f
      HK_CI_TESTS: >-
        tests/hk/gpu/test_engine_contract.py tests/hk/gpu/test_vllm_mxfp8.py
        tests/hk/gpu/test_vllm_moe_a8w4.py tests/hk/gpu/test_mxfp8_quant.py
        tests/hk/gpu/test_mxfp8_gemm.py tests/hk/gpu/test_moe_a8w4.py
        tests/hk/gpu/test_cdna_mx_ops.py tests/hk/gpu/test_scatter_add.py
        tests/hk/gpu/test_fenced.py
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: The DeepSeek-V4.1 routes in the vLLM image on an MI355X
        run: exec scripts/ci/run_gfx950.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx950-vllm-report
          path: gha-report/
          if-no-files-found: ignore

  gfx1100:
    # The runner labelled gfx1100-x4 relays to pod hfang-hk-ci-0044
    # (scripts/ci/k8s/gfx1100-ci-0044.yaml): four W7900D the device plugin
    # gave that pod alone, so no node lock, and the suite's groups sharded
    # over all four. Fallback: runs-on [self-hosted, hk-gpu, gfx1100] and no
    # env -- the dev pod's single GPU 6 under the node lock.
    runs-on: [self-hosted, hk-gpu, gfx1100-x4]
    timeout-minutes: 180
    concurrency:
      group: gpu-gfx1100-${{ github.ref }}
      cancel-in-progress: false
    env:
      HK_CI_POD: hfang-hk-ci-0044
      HK_CI_POD_GPUS: "0 1 2 3"
      HK_CI_NODE_LOCKS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GPU tier on four W7900D of the CI pod (sharded)
        run: exec scripts/ci/run_gfx1100.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx1100-report
          path: gha-report/
          if-no-files-found: ignore
