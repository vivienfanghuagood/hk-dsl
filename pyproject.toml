[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-dsl"
version = "0.3.1"
description = "Radeon kernels in Python over an MLIR dialect, generating HipKittens C++"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# numpy and typing_extensions are what the MLIR Python bindings import.
dependencies = ["pybind11>=2.10", "numpy", "typing_extensions"]

# The README's links are relative, which resolve nowhere on a package index.
[project.urls]
Homepage = "https://github.com/vivienfanghuagood/hk-dsl"
Documentation = "https://github.com/vivienfanghuagood/hk-dsl/tree/main/docs"
Examples = "https://github.com/vivienfanghuagood/hk-dsl/tree/main/examples"
Issues = "https://github.com/vivienfanghuagood/hk-dsl/issues"

# torch is not a dependency. hk traces without it and compiles without it --
# only launching needs it, and on a ROCm box it is already installed by
# something with strong opinions about which build. Declaring it here would
# fight that.
[project.optional-dependencies]
test = ["pytest>=7"]

# vLLM loads this in the driver *and* in every worker process, which is the
# only place a patch of torch.nn.functional reaches the model: V1 runs the
# engine in a spawned subprocess, so patching from the process that built the
# LLM object patches a process the model never runs in. Gated on
# HK_PATCH_VLLM=1 -- installing a kernel library must not silently change the
# numerics of every vLLM on the machine. See hk/integration/_vllm_plugin.py.
[project.entry-points."vllm.general_plugins"]
hk_attention = "hk.integration._vllm_plugin:register"

# SGLang loads these in the launcher and in every scheduler process, where its
# model runs. Gated on HK_SGLANG_LINEAR=1 for the same reason. See
# hk/integration/_sglang_plugin.py.
[project.entry-points."sglang.srt.plugins"]
hk = "hk.integration._sglang_plugin:register"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

# The generated kernels #include these at JIT time, so the headers are data the
# package needs at runtime, not build inputs.
[tool.setuptools.package-data]
hk = [
    "include/**/*.cuh",
    "include/**/*.h",
    # Tuning records: the schedules measured per arch, read by hk.autotune at
    # launch and prebuilt by `python3 -m hk.autotune --aot`. Data, like the
    # headers -- shipping the wheel without them means every install starts at
    # the default tiling and JITs on its first call.
    "tuned/*.json",
    "tuned/README.md",
    # The MLIR bindings for the hk dialect, built by scripts/build_hk_mlir.sh
    # for one interpreter (see setup.py). Mostly namespace packages, so they
    # are listed as data rather than found.
    "_mlir/**/*.py",
    "_mlir/**/*.pyi",
    "_mlir/_mlir_libs/*.so",
    "_mlir/_mlir_libs/*.so.*",
]

[tool.pytest.ini_options]
testpaths = ["tests/hk"]
# gpu marks the tier that needs a Radeon; ir and codegen tiers run anywhere,
# and codegen needs only hipcc. Two of the three run on a laptop.
markers = [
    "gpu: requires a Radeon GPU and torch",
    "hipcc: requires a working hipcc (but no GPU)",
]
