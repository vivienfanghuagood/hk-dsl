# The gfx1100 GPU tier's pod: four W7900D of node wx-ms-w7900d-0044, requested from the
# scheduler (amd.com/gpu: 4) and handed over by the AMD device plugin -- only those four render
# nodes and /dev/kfd are in the container. Not privileged: no other pod can be given these
# cards, and this one sees no others, so the run needs no node-level lock (pod_run.sh with
# HK_CI_NODE_LOCKS=0). CI's state (clone, dialect build, compile cache, runs) and its tools
# (the MLIR install, FlyDSL) live on the PVC at /workspace, so a pod restart keeps them.
#
#   kubectl apply -f scripts/ci/k8s/gfx1100-ci-0044.yaml
#
# Bootstrapping the PVC once (MLIR install, FlyDSL, the extra pip packages): docs/testing.md.
# No credentials here: the job's runner lives on the MI355X workstation and reaches the pod
# with `ssh 0004 kubectl exec`; the pod fetches commits through the gh-test proxy itself.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hfang-hk-ci-0044
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: disk-local          # node-local: binds to 0044 with the pod
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: hfang-hk-ci-0044
  namespace: default
  labels:
    app: hfang-hk-ci-0044
spec:
  nodeSelector:
    kubernetes.io/hostname: wx-ms-w7900d-0044
  restartPolicy: Always
  containers:
    - name: ci
      image: docker.io/rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests:
          amd.com/gpu: 4
          cpu: "32"
          memory: 96Gi
        limits:
          amd.com/gpu: 4
          cpu: "32"
          memory: 128Gi
      volumeMounts:
        - name: work
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: hfang-hk-ci-0044
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
